<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>反应堆物理 · 名词解释记忆卡</title>
<style>
:root{
  --daimon-widget-host-safe-inline-end:190px;
  --daimon-widget-host-safe-block-start:44px;
  /* 本地语义色板：优先取运行时 token，取不到时用固定色兜底 */
  --m-ok:var(--kimi-color-positive,#1f9d55);
  --m-warn:var(--kimi-color-warning,#e39a2d);
  --m-bad:var(--kimi-color-danger,#e5534b);
  --m-accent:var(--kimi-color-accent,#3b6fe0);
  --m-text:var(--kimi-color-text-primary,#1c1c1e);
  --m-text2:var(--kimi-color-text-secondary,#5a5a60);
  --m-text3:var(--kimi-color-text-tertiary,#8b8b92);
  --m-text4:var(--kimi-color-text-quaternary,#a9a9b0);
  --m-bg:var(--kimi-color-surface,#ffffff);
  --m-muted:var(--kimi-color-surface-muted,#f2f2f4);
  --m-raised:var(--kimi-color-surface-raised,#ffffff);
  --m-border:var(--kimi-color-border,#e2e2e6);
  --m-on:var(--kimi-color-on-accent,#ffffff);
  /* 液态玻璃材质（token 缺失时的兜底值） */
  --g-surface:var(--kimi-glass-surface,rgba(255,255,255,.45));
  --g-border:var(--kimi-glass-border,rgba(255,255,255,.45));
  --g-hi:var(--kimi-glass-highlight,rgba(255,255,255,.8));
  --g-lo:var(--kimi-glass-lowlight,rgba(255,255,255,.12));
  --g-shadow:var(--kimi-glass-shadow,rgba(31,56,120,.10));
  --g-blur:var(--kimi-glass-blur,16px);
}
.kimi-host-safe-context{container-type:inline-size;}
.kimi-host-safe-header{
  box-sizing:border-box;
  min-block-size:var(--daimon-widget-host-safe-block-start,44px);
  padding-inline-end:var(--daimon-widget-host-safe-inline-end,190px);
}
@container (max-width:419px){
  .kimi-host-safe-header{
    min-block-size:0;
    padding-block-start:var(--daimon-widget-host-safe-block-start,44px);
    padding-inline-end:0;
  }
}
[data-kimi-root]{box-sizing:border-box;inline-size:100%;min-inline-size:0;max-inline-size:100%;overflow:visible;}
[data-kimi-root] *{box-sizing:border-box;min-inline-size:0;}
html[data-daimon-size-tier="compact"] [data-kimi-priority="p1"],
html[data-daimon-size-tier="compact"] [data-kimi-priority="p2"],
html[data-daimon-size-tier="compact"] [data-kimi-priority="p3"]{display:none!important;}
@media (prefers-reduced-motion:reduce){
  [data-kimi-root] *{scroll-behavior:auto;transition:none!important;animation:none!important;}
}

html,body{margin:0;padding:0;background:transparent;}
body{
  font-family:var(--kimi-font-sans,system-ui,sans-serif);
  color:var(--m-text);font-size:14px;line-height:1.55;
}
.widget{padding:2px 16px 18px;}

/* ---------- 液态玻璃材质 ---------- */
.lglass{
  border:1px solid var(--m-border);
  background:var(--m-raised);
  border-radius:16px;
}
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
  .lglass{
    background:var(--g-surface);
    border-color:var(--g-border);
    backdrop-filter:blur(var(--g-blur)) saturate(1.7);
    -webkit-backdrop-filter:blur(var(--g-blur)) saturate(1.7);
    box-shadow:
      0 10px 34px var(--g-shadow),
      inset 0 1px 0 var(--g-hi),
      inset 0 -1px 0 var(--g-lo),
      inset 1px 0 0 var(--g-lo);
  }
}
/* 玻璃顶部高光轨 */
.lglass-rail{position:relative;overflow:hidden;isolation:isolate;}
.lglass-rail::before{
  position:absolute;inset-block-start:0;inset-inline:6%;block-size:1px;content:'';
  background:linear-gradient(90deg,transparent,var(--g-hi),transparent);
  pointer-events:none;z-index:2;
}

/* ---------- 玻璃舞台（干净无背景雾效） ---------- */
.kimi-glass-stage{position:relative;isolation:isolate;}

/* ---------- header ---------- */
.hdr{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.hdr .ttl{display:flex;flex-direction:column;gap:1px;}
.hdr h1{font-size:17px;font-weight:600;margin:0;}
.hdr .sub{font-size:12px;color:var(--m-text3);}
.progress-pill{
  margin-inline-start:auto;display:flex;align-items:center;gap:8px;
  font-size:12.5px;font-weight:500;color:var(--m-text2);
  border-radius:999px;padding:5px 13px;font-variant-numeric:tabular-nums;
}
.progress-pill b{color:var(--m-ok);font-weight:600;}

/* segmented mastery bar */
.mbar{height:8px;border-radius:99px;background:var(--m-muted);overflow:hidden;display:flex;margin:12px 0 4px;}
.mbar i{display:block;height:100%;transition:width .4s ease;}
.mbar .s-ok{background:var(--m-ok);}
.mbar .s-warn{background:var(--m-warn);}
.mbar .s-seen{background:#f2d9a4;}
.mbar .s-bad{background:var(--m-bad);}

/* ---------- heat strip ---------- */
.strip-wrap{margin:10px 0 16px;}
.strip{display:flex;gap:4px;flex-wrap:wrap;}
.cell{
  width:22px;height:22px;border-radius:6px;cursor:pointer;padding:0;
  font-size:10.5px;font-weight:600;font-family:inherit;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--m-border);background:var(--m-muted);color:var(--m-text4);
  transition:transform .12s ease,box-shadow .12s ease;
}
.cell:hover{transform:translateY(-2px);box-shadow:0 3px 8px rgba(0,0,0,.12);}
.cell:focus-visible{outline:2px solid var(--m-accent);outline-offset:1px;}
.cell[data-m="1"]{background:#fbe3e1;border-color:#f0b7b3;color:var(--m-bad);}
.cell[data-m="2"]{background:var(--m-warn);border-color:var(--m-warn);color:#fff;}
.cell[data-m="3"]{background:var(--m-ok);border-color:var(--m-ok);color:#fff;}
.cell[data-m="0"].fail{background:#fbe3e1;border-color:#f0b7b3;color:var(--m-bad);}
.cell.cur{outline:2.5px solid var(--m-accent);outline-offset:1.5px;}
.strip-legend{display:flex;gap:16px;margin-top:8px;font-size:11.5px;color:var(--m-text3);flex-wrap:wrap;}
.strip-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px;border:1px solid var(--m-border);}
.lg-0{background:var(--m-muted);}
.lg-1{background:#fbe3e1;border-color:#f0b7b3;}
.lg-2{background:var(--m-warn);border-color:var(--m-warn);}
.lg-3{background:var(--m-ok);border-color:var(--m-ok);}

/* ---------- 玻璃分段控件 tabs ---------- */
.tabs{
  display:inline-flex;align-items:center;gap:3px;padding:3px;margin-bottom:16px;
  border:1px solid var(--m-border);border-radius:12px;background:var(--m-muted);
}
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
  .tabs{
    background:var(--g-surface);border-color:var(--g-border);
    backdrop-filter:blur(var(--g-blur)) saturate(1.6);
    -webkit-backdrop-filter:blur(var(--g-blur)) saturate(1.6);
    box-shadow:inset 0 1px 0 var(--g-hi),0 4px 16px var(--g-shadow);
  }
}
.tab{
  font:inherit;font-size:13px;padding:7px 15px;border:0;background:none;cursor:pointer;
  color:var(--m-text2);border-radius:9px;transition:background .15s,color .15s,box-shadow .15s;
}
.tab:hover{color:var(--m-text);}
.tab[aria-selected="true"]{
  color:var(--m-on);font-weight:600;background:var(--m-accent);
  box-shadow:0 2px 8px rgba(59,111,224,.35),inset 0 1px 0 rgba(255,255,255,.3);
}
.tab:focus-visible{outline:2px solid var(--m-accent);outline-offset:2px;}
.tab .badge{
  display:inline-block;min-width:17px;text-align:center;font-size:11px;font-weight:600;border-radius:9px;
  background:var(--m-bad);color:#fff;padding:1px 5px;margin-inline-start:5px;font-variant-numeric:tabular-nums;
}
.tab[aria-selected="true"] .badge{background:#fff;color:var(--m-bad);}
.panel{display:none;animation:fadeIn .25s ease;}
.panel.on{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* ---------- 闪卡（玻璃 3D 翻牌） ---------- */
.card-stage{display:flex;flex-direction:column;gap:14px;}
.flip-box{perspective:1400px;cursor:pointer;position:relative;z-index:1;}
.flip-box:focus-visible{outline:2px solid var(--m-accent);outline-offset:3px;border-radius:18px;}
.flip-inner{
  position:relative;min-height:200px;transform-style:preserve-3d;
  transition:transform .6s cubic-bezier(.35,.15,.2,1);
}
.flip-box.flipped .flip-inner{transform:rotateY(180deg);}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  padding:28px 28px 22px;
  display:flex;flex-direction:column;justify-content:center;gap:12px;
}
.face.back{transform:rotateY(180deg);}
.face .no{font-size:11.5px;color:var(--m-text4);font-variant-numeric:tabular-nums;position:absolute;top:15px;left:19px;}
.face .mstate{position:absolute;top:13px;right:17px;font-size:11px;font-weight:600;border-radius:99px;padding:2px 9px;}
.ms-0{background:rgba(140,140,150,.18);color:var(--m-text3);}
.ms-1{background:#fbe3e1;color:var(--m-bad);}
.ms-2{background:var(--m-warn);color:#fff;}
.ms-3{background:var(--m-ok);color:#fff;}
.face .term{font-size:25px;font-weight:600;line-height:1.3;text-align:center;}
.face .def{font-size:15px;line-height:1.8;margin:0;color:var(--m-text);}
.face .hint{font-size:12px;color:var(--m-text3);text-align:center;}
.face .confuse{
  font-size:12px;color:#7a5a17;background:rgba(250,226,168,.55);border:1px solid rgba(226,196,124,.7);
  border-radius:9px;padding:6px 10px;text-align:center;
}
.def mark{background:none;padding:0;color:inherit;}
.def mark.kw{color:var(--m-accent);font-weight:600;box-shadow:inset 0 -2px 0 rgba(59,111,224,.25);}
.face .plain{
  font-size:12.5px;line-height:1.65;color:var(--m-text2);margin:0;
  border-left:3px solid var(--m-accent);padding:6px 10px;
  background:rgba(59,111,224,.06);border-radius:0 9px 9px 0;
}
.face .plain::before{content:"💡 大白话：";font-weight:600;color:var(--m-accent);}

.grades{display:flex;gap:10px;position:relative;z-index:1;}
.grades button{
  flex:1;font:inherit;font-size:14px;font-weight:600;padding:11px 0;border-radius:13px;cursor:pointer;
  border:0;color:#fff;transition:transform .1s ease,filter .12s ease,opacity .12s ease;
  box-shadow:0 3px 10px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.28);
}
.grades button:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.07);}
.grades button:active:not(:disabled){transform:translateY(0);}
.grades button:focus-visible{outline:2px solid var(--m-text);outline-offset:2px;}
.grades .g-ok{background:linear-gradient(180deg,#27b566,var(--m-ok));}
.grades .g-mid{background:linear-gradient(180deg,#f0ab43,var(--m-warn));}
.grades .g-bad{background:linear-gradient(180deg,#ef6a62,var(--m-bad));}
.grades button:disabled{opacity:.32;cursor:default;box-shadow:none;}
.grades small{display:block;font-size:10.5px;font-weight:400;opacity:.88;}

.nav-row{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap;}
.nav-row .pos{font-size:12px;color:var(--m-text3);font-variant-numeric:tabular-nums;}
.nav-row .navbtns{display:flex;gap:6px;}

/* ---------- 玻璃按钮 ---------- */
.btn-ghost{
  font:inherit;font-size:12.5px;padding:7px 13px;border-radius:10px;cursor:pointer;
  border:1px solid var(--m-border);background:var(--m-bg);color:var(--m-text2);
  transition:color .12s,border-color .12s,transform .1s;
}
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
  .btn-ghost{
    background:var(--g-surface);border-color:var(--g-border);
    backdrop-filter:blur(var(--g-blur)) saturate(1.5);
    -webkit-backdrop-filter:blur(var(--g-blur)) saturate(1.5);
    box-shadow:inset 0 1px 0 var(--g-hi),0 2px 8px var(--g-shadow);
  }
}
.btn-ghost:hover{color:var(--m-text);transform:translateY(-1px);}
.btn-ghost:focus-visible{outline:2px solid var(--m-accent);outline-offset:2px;}
.btn-ghost.primary{border-color:var(--m-accent);color:var(--m-accent);font-weight:600;}
.btn-main{
  font:inherit;font-size:13.5px;font-weight:600;padding:10px 20px;border-radius:12px;cursor:pointer;
  border:0;background:linear-gradient(180deg,#5283ec,var(--m-accent));color:var(--m-on);
  box-shadow:0 3px 12px rgba(59,111,224,.32),inset 0 1px 0 rgba(255,255,255,.3);
  transition:filter .12s,transform .1s;
}
.btn-main:hover{filter:brightness(1.07);}
.btn-main:active{transform:translateY(1px);}
.btn-main:focus-visible{outline:2px solid var(--m-text);outline-offset:2px;}

/* ---------- 跳题选择器 ---------- */
.picker{display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:relative;z-index:1;}
.picker label{font-size:12px;color:var(--m-text3);}
.picker select{
  font:inherit;font-size:13px;color:var(--m-text);
  border:1px solid var(--m-border);border-radius:10px;background:var(--m-bg);
  padding:7px 10px;max-width:230px;cursor:pointer;
}
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
  .picker select{background:var(--g-surface);border-color:var(--g-border);}
}
.picker select:focus-visible{outline:2px solid var(--m-accent);outline-offset:1px;}

/* ---------- 挖空 ---------- */
.cloze-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;position:relative;z-index:1;}
.cloze-no{font-size:11.5px;color:var(--m-text4);}
.cloze-term{font-size:19px;font-weight:600;margin:0;}
.cloze-def{
  position:relative;z-index:1;
  font-size:15px;line-height:2.3;margin:12px 0 14px;padding:20px 22px;
}
.cloze-def input{
  font:inherit;font-size:13.5px;min-width:70px;max-width:170px;
  border:0;border-bottom:2px solid var(--m-text3);
  background:rgba(59,111,224,.06);color:var(--m-text);
  padding:2px 6px;margin:0 3px;text-align:center;border-radius:6px 6px 0 0;
  transition:border-color .12s,background .12s;
}
.cloze-def input:focus-visible{outline:none;border-bottom-color:var(--m-accent);background:rgba(59,111,224,.12);}
.cloze-def input.ok{border-bottom-color:var(--m-ok);color:var(--m-ok);font-weight:600;background:rgba(31,157,85,.08);}
.cloze-def input.bad{border-bottom-color:var(--m-bad);color:var(--m-bad);background:rgba(229,83,75,.07);}
.cloze-def .ans{color:var(--m-bad);font-size:12.5px;font-weight:600;margin-inline-start:5px;}
.cloze-btns{display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:relative;z-index:1;}
.cloze-score{font-size:13px;font-weight:600;color:var(--m-text2);font-variant-numeric:tabular-nums;}
.cloze-score.win{color:var(--m-ok);}
.cloze-tip{font-size:12px;color:var(--m-text3);margin:10px 0 0;position:relative;z-index:1;}

/* ---------- 复盘 ---------- */
.review-empty{
  border:1.5px dashed var(--m-border);border-radius:16px;padding:30px 20px;text-align:center;
  color:var(--m-text2);font-size:13.5px;background:var(--m-muted);
}
.review-empty b{color:var(--m-ok);font-weight:600;font-size:15px;}
.review-list{display:flex;flex-direction:column;gap:8px;margin:0 0 16px;padding:0;list-style:none;}
.review-item{
  display:flex;align-items:center;gap:10px;
  border-radius:13px;padding:11px 15px;cursor:pointer;
  transition:transform .12s,border-color .12s;
}
.review-item:hover{transform:translateX(3px);}
.review-item .t{font-weight:500;font-size:14px;}
.review-item .cnt{margin-inline-start:auto;font-size:12px;color:var(--m-bad);font-variant-numeric:tabular-nums;white-space:nowrap;}
.review-item .lvl{font-size:11.5px;font-weight:600;border-radius:7px;padding:2px 8px;white-space:nowrap;}
.lvl.l2{background:#f7ecd4;color:#7a5a17;}
.lvl.l1{background:#fbe3e1;color:var(--m-bad);}

.pairs{margin-top:18px;border-top:1px solid var(--m-border);padding-top:10px;}
.pairs summary{font-size:13px;font-weight:500;color:var(--m-text2);cursor:pointer;user-select:none;padding:6px 0;}
.pairs summary:hover{color:var(--m-accent);}
.pairs summary:focus-visible{outline:2px solid var(--m-accent);outline-offset:2px;}
.pair-table{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:13px;border-radius:10px;overflow:hidden;}
.pair-table caption{text-align:left;font-weight:600;padding:8px 0 6px;color:var(--m-text);}
.pair-table th,.pair-table td{border:1px solid var(--m-border);padding:9px 12px;text-align:left;vertical-align:top;}
.pair-table th{background:var(--m-muted);font-weight:600;white-space:nowrap;}

.foot{margin-top:16px;font-size:11.5px;color:var(--m-text4);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.foot button{font:inherit;font-size:11.5px;color:var(--m-text3);background:none;border:0;cursor:pointer;text-decoration:underline;padding:0;}
.foot button:focus-visible{outline:2px solid var(--m-accent);}

@media (max-width:519px){
  .face{padding:20px 16px 18px;}
  .face .term{font-size:20px;}
  .grades{flex-direction:column;}
  .grades button{padding:10px 0;}
  .hdr h1{font-size:15.5px;}
  .flux{filter:blur(30px);}
}
</style>
</head>
<body>
<main class="widget kimi-host-safe-context" data-kimi-root>
  <header class="hdr kimi-host-safe-header" data-kimi-priority="p1">
    <div class="ttl">
      <h1>反应堆物理 · 名词解释</h1>
      <span class="sub">58 题 · 60 词条 · 点击方格可跳题</span>
    </div>
    <span class="progress-pill lglass" id="progressPill" role="status">掌握 <b>0</b>/22</span>
  </header>

  <div class="mbar" id="mbar" data-kimi-priority="p1" aria-hidden="true">
    <i class="s-ok"></i><i class="s-warn"></i><i class="s-seen"></i><i class="s-bad"></i>
  </div>

  <section class="strip-wrap" data-kimi-priority="p1" aria-label="掌握度总览">
    <div class="strip" id="strip"></div>
    <div class="strip-legend">
      <span><i class="lg-0"></i>未学</span>
      <span><i class="lg-1"></i>忘了</span>
      <span><i class="lg-2"></i>模糊</span>
      <span><i class="lg-3"></i>掌握</span>
    </div>
  </section>

  <nav class="tabs" role="tablist" data-kimi-priority="p0">
    <button class="tab" role="tab" aria-selected="true" data-tab="flash">闪卡记忆</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="cloze">挖空检验</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="review">复盘<span class="badge" id="dueBadge" hidden>0</span></button>
  </nav>

  <!-- 闪卡 -->
  <section class="panel on" id="panel-flash" role="tabpanel" data-kimi-priority="p0">
    <div class="card-stage kimi-glass-stage">
      <div class="picker" data-kimi-priority="p2">
        <label for="fJump">跳到</label>
        <select id="fJump"></select>
      </div>
      <div class="flip-box" id="flipBox" tabindex="0" role="button" aria-label="点击翻面查看答案">
        <div class="flip-inner">
          <div class="face front lglass lglass-rail">
            <span class="no" id="fNoF"></span>
            <span class="mstate" id="fMsF"></span>
            <div id="fFront"></div>
            <span class="hint">先默背解释，点击卡片翻面核对（空格键也可以）</span>
          </div>
          <div class="face back lglass lglass-rail">
            <span class="no" id="fNoB"></span>
            <div id="fBack"></div>
            <span class="hint">蓝字是给分关键词，然后给自己打分 ↓</span>
          </div>
        </div>
      </div>
      <div class="grades" id="gradeRow">
        <button class="g-ok" data-g="3" disabled>记住了<small>出队 · 变绿</small></button>
        <button class="g-mid" data-g="2" disabled>模糊<small>进复盘队列</small></button>
        <button class="g-bad" data-g="1" disabled>忘了<small>进复盘队列</small></button>
      </div>
      <div class="nav-row" data-kimi-priority="p2">
        <span class="pos" id="fPos"></span>
        <div class="navbtns">
          <button class="btn-ghost primary" id="fShuffle">随机抽题</button>

30:"加了反射层之后，反应堆能缩小多少尺寸还能临界。就是【有了反射层，临界尺寸能省多少】。",

32:"裂变瞬间马上放出来的那些中子，它们的能量是怎么分布的。就是【瞬发中子的能量分布图】。",
33:"裂变产生的中子里，能量落在某个小区间的占多少比例。就是【裂变中子按能量怎么分的】。",
34:"中子在慢化过程中，不同能量的中子数量是怎么分布的。就是【正在变慢的中子，能量分布长什么样】。",
35:"单位时间、单位体积里，有多少中子已经慢化到某个能量 E 以下。就是【每秒每立方厘米，慢到这个能量以下的中子有多少】。",
36:"燃料里刚产生的中子，还没撞到任何东西，就直接跑出燃料芯块、跑到慢化剂里的概率。就是【中子第一次飞行就逃出燃料的概率】。",
37:"慢化剂（水）的体积，除以燃料芯块的体积。就是【水和铀（燃料）的体积比】。",
38:"已经慢化到和周围介质温度差不多、动能很低的中子。就是【已经冷却下来、跑得很慢的中子】。",
39:"核素之间怎么一步步转化的路线图。就是【核素互相变成谁的转化路径】。",
40:"从装料开始跑，一直到堆芯在满功率下刚好临界（Keff 降到 1）为止，能用多长时间。就是【这堆燃料能撑多久】。",
41:"装进堆芯的单位质量燃料，一共发出了多少能量。就是【每公斤燃料烧掉了多少电】。",
42:"裂变产物吸收中子，导致反应堆反应性下降的那部分变化量。就是【裂变垃圾把中子抢走，让反应性掉了多少】。",
43:"裂变产物里有些核素，一边产生一边自己又被中子吃掉或裂变掉，到一定时间后产生和消失刚好打平。就是【会自己平衡、不再堆积的裂变垃圾】。",
44:"这些裂变产物几乎不会消失，或者消失得极少，运行时间越长，浓度就一直往上累。就是【越烧越多、停不下来的裂变垃圾】。",
45:"堆里某个参数变一点点，反应性会跟着变多少。就是【某个量变 1 单位，反应性跟着变多少】。",
46:"燃料温度或慢化剂温度升 1 K（或降 1 K），反应性会变多少。就是【温度变 1 度，反应性跟着变多少】。",
47:"冷却剂里空泡（气泡）份额变 1%，反应性会变多少。就是【气泡多 1%，反应性跟着变多少】。",
48:"功率变 1 个单位，反应性会跟着变多少。就是【功率变一点，反应性跟着变多少】。",
49:"把某种控制毒物全部扔进堆芯，反应性会变多少。就是【这个毒物全放进去能压多少反应性】。",
50:"在临界运行时，考虑功率带来的正反应性，再加上价值最大的那根控制棒卡住拔不出来，其他棒全插下去后，反应堆还能到多深的次临界。就是【最坏情况下还能停多深】。",
51:"控制棒价值：一根控制棒插进去能压多少反应性；积分价值：从某个位置插到某个位置总共压了多少；微分价值：在某个位置附近再插一点点能压多少。",
52:"堆芯不同位置的中子，对整堆功率的贡献不一样。位置好的中子【价值】更高。",
53:"不考虑控制棒，只靠可燃毒物和可溶硼，把反应堆刚好调到临界时的硼浓度。就是【只靠硼来临界时需要多少硼】。",
54:"冷却剂里硼浓度变 1 个单位（比如 1 ppm），反应性会变多少。就是【硼变一点，反应性跟着变多少】。",
55:"因为加了可燃毒物，堆芯寿期会缩短的那部分。就是【加毒物多付的寿命代价】。",
56:"中子密度涨到原来的 e 倍（约 2.718 倍）需要多长时间。就是【中子数量涨 e 倍要多久】。",
57:"热中子从产生到被吸收的平均时间。就是【热中子平均能活多久】。",
58:"反应堆只靠瞬发中子就能维持临界（不需要缓发中子帮忙）。这是很危险的状态。",
59:"Keff 小于 1（或 ρ 小于 0）的状态，链式反应维持不下去。就是【还差多少才能临界】。",
60:"堆芯里把所有毒物都拿掉后，还剩多少反应性。就是【干净堆芯本身有多少多余反应性】。"
};
const GROUPS={g1:"易混组：三种核素，注意区分",g2:"易混组：慢化 vs 扩散，注意区分",g3:"易混组：倍增 vs 有效裂变中子数",g4:"易混组：两种不泄漏概率",g5:"易混组：三种长度（扩散/慢化/徙动）",g6:"易混组：三种时间（扩散/慢化/寿命）",g7:"易混组：能谱家族",g8:"易混组：饱和 vs 非饱和裂变产物",g9:"易混组：反应性系数家族"};
const PAIRS=[
 {name:"微观截面 vs 宏观截面",rows:[["微观截面","平均<b>一个</b>入射中子与<b>一个</b>原子核发生作用的概率大小"],["宏观截面","平均一个中子与<b>单位体积内所有</b>原子核发生作用的概率大小"]]},
 {name:"易裂变 / 可裂变 / 可转化核素",rows:[["易裂变核素","<b>热中子或低能中子</b>即可引起裂变，如 U-235、Pu-239"],["可裂变核素","需<b>快中子或较高能量中子</b>才能有效裂变，如 U-238"],["可转化核素","本身不易裂变，<b>吸收中子后转化</b>为易裂变核素，如 U-238→Pu-239、Th-232→U-233"]]},
 {name:"慢化过程 vs 扩散过程",rows:[["慢化过程","中子<b>能量</b>不断减少，直至变成热中子"],["扩散过程","<b>热中子</b>在介质中（空间分布）不断变化"]]},
 {name:"慢化不泄漏 vs 扩散不泄漏",rows:[["慢化不泄漏概率","<b>慢化过程</b>中没有泄漏到堆外的中子数所占比例"],["扩散不泄漏概率","<b>扩散过程</b>中没有泄漏到堆外的中子数所占比例"]]},
 {name:"快中子倍增系数 vs 有效裂变中子数",rows:[["快中子倍增系数 ε","一个初始裂变中子经<b>可裂变核素</b>裂变后增加得到的平均中子数"],["有效裂变中子数 η","燃料每<b>吸收一个中子</b>所产生的平均裂变中子数"]]},
 {name:"扩散长度 vs 慢化长度 vs 徙动长度",rows:[["中子扩散长度","<b>热中子</b>从产生至<b>被吸收</b>所穿行直线距离方均值的 1/6"],["中子慢化长度","快中子从<b>点源</b>出发至<b>慢化到热中子</b>时所穿行直线距离方均值的 1/6"],["中子徙动长度","快中子从<b>产生到被吸收</b>（全过程）所穿行直线距离方均值的 1/6"]]},
 {name:"慢化时间 vs 扩散时间 vs 中子寿命",rows:[["中子慢化时间","裂变中子从<b>裂变能</b>慢化到<b>热中子分界能</b>所需平均时间"],["中子扩散时间","慢化成热中子<b>后</b>，扩散到被吸收所需平均时间"],["中子寿命","慢化时间 + 扩散时间：<b>从产生到被吸收</b>的总平均时间"]]},
 {name:"反应性系数家族",rows:[["反应性系数","某个<b>参数</b>发生单位变化引起的反应性变化量（总称）"],["温度系数","燃料/慢化剂<b>温度变化 1 K</b>引起的反应性变化量"],["空泡系数","冷却剂<b>空泡份额变化 1%</b>引起的反应性变化量"],["功率系数","<b>单位功率变化</b>引起的反应性变化量"],["硼微分价值","冷却剂中<b>单位硼浓度变化（1 ppm）</b>引起的反应性变化量"]]}
];

const LS="reactor-phys-cards-v1";
let state;
try{state=JSON.parse(localStorage.getItem(LS))||{};}catch(e){state={};}
if(!state.m)state={m:{}};
function save(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
function rec(id){return state.m[id]||{lvl:0,fail:0,seen:0};}
function setRec(id,lvl){
  const r=rec(id);r.seen++;r.lvl=lvl;
  if(lvl!==3)r.fail++;
  state.m[id]=r;save();
}
function isDue(id){const r=rec(id);return r.lvl===1||r.lvl===2;}

/* 全局共享当前题索引：闪卡和挖空始终同步 */
let cur=0,flipped=false,session=null;

const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lvlName=["未学","忘了","模糊","掌握"];

function curTerm(){return session?TERMS.find(t=>t.id===session[cur]):TERMS[cur];}
function activePanel(){const p=document.querySelector(".panel.on");return p?p.id.replace("panel-",""):"flash";}

/* 统一跳题入口：任何模式跳转都会同步两边 */
function goTo(idx){
  const len=session?session.length:TERMS.length;
  cur=((idx%len)+len)%len;flipped=false;
  renderFlash();
  if(activePanel()==="cloze")renderCloze();
  syncPickers();renderStrip();
}

/* ---------- 下拉跳题 ---------- */
function buildPickers(){
  ["fJump","cJump"].forEach(pid=>{
    const sel=document.getElementById(pid);
    sel.innerHTML=TERMS.map((t,i)=>'<option value="'+i+'">'+t.no+". "+esc(t.term)+"</option>").join("");
    sel.onchange=()=>{session=null;goTo(+sel.value);};
  });
}
function syncPickers(){
  const idx=session?TERMS.findIndex(t=>t.id===session[cur]):cur;
  document.getElementById("fJump").value=idx;
  document.getElementById("cJump").value=idx;
}

/* ---------- 掌握度总览 ---------- */
function renderStrip(){
  const el=$("#strip");el.innerHTML="";
  TERMS.forEach((t,i)=>{
    const r=rec(t.id);
    const b=document.createElement("button");
    const isCur=session?t.id===session[cur]:i===cur;
    b.className="cell"+(isCur?" cur":"")+(r.lvl===0&&r.fail>0?" fail":"");
    b.dataset.m=r.lvl;
    b.textContent=t.no==="10"?["10a","10b","10c"][t.id-10]:t.no;
    b.title=t.no+". "+t.term+"（"+lvlName[r.lvl]+"）";
    b.setAttribute("aria-label",t.term+" "+lvlName[r.lvl]);
    b.onclick=()=>{session=null;goTo(i);};
    el.appendChild(b);
  });
  const counts=[0,0,0,0];
  TERMS.forEach(t=>counts[rec(t.id).lvl]++);
  $("#progressPill").innerHTML="掌握 <b>"+counts[3]+"</b>/"+TERMS.length;
  const seg=p=>(p/TERMS.length*100)+"%";
  document.querySelector("#mbar .s-ok").style.width=seg(counts[3]);
  document.querySelector("#mbar .s-warn").style.width=seg(counts[2]);
  document.querySelector("#mbar .s-seen").style.width="0%";
  document.querySelector("#mbar .s-bad").style.width=seg(counts[1]+TERMS.filter(t=>rec(t.id).lvl===0&&rec(t.id).fail>0).length);
  const due=TERMS.filter(t=>isDue(t.id)).length;
  const badge=$("#dueBadge");
  badge.hidden=due===0;badge.textContent=due;
}

/* ---------- 闪卡 ---------- */
function renderFlash(){
  const t=curTerm(),r=rec(t.id);
  const noTxt="第 "+t.no+" 题 · "+(session?"复盘 "+(cur+1)+"/"+session.length:"词条 "+(TERMS.findIndex(x=>x.id===t.id)+1)+"/"+TERMS.length);
  $("#fNoF").textContent=noTxt;$("#fNoB").textContent=noTxt;
  const ms=$("#fMsF");
  ms.className="mstate ms-"+r.lvl;ms.textContent=lvlName[r.lvl];
  let front='<div class="term">'+esc(t.term)+"</div>";
  if(t.grp)front+='<div class="confuse">⚠ '+GROUPS[t.grp]+"</div>";
  $("#fFront").innerHTML=front;
  let def=esc(t.def);
  t.kw.forEach(k=>{def=def.replace(esc(k),'<mark class="kw">'+esc(k)+"</mark>");});
  let backHtml='<p class="def">'+def+"</p>";
  if(PLAIN[t.id])backHtml+='<p class="plain">'+esc(PLAIN[t.id])+"</p>";
  $("#fBack").innerHTML=backHtml;
  $("#flipBox").classList.toggle("flipped",flipped);
  document.querySelectorAll("#gradeRow button").forEach(b=>b.disabled=!flipped);
  $("#fPos").textContent="本词已见 "+r.seen+" 次 · 错 "+r.fail+" 次";
}
$("#flipBox").addEventListener("click",()=>{flipped=!flipped;renderFlash();});
$("#flipBox").addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flipped=!flipped;renderFlash();}});
document.querySelectorAll("#gradeRow button").forEach(b=>b.addEventListener("click",()=>{
  const t=curTerm();setRec(t.id,+b.dataset.g);
  if(session&&cur===session.length-1){
    session=TERMS.filter(x=>isDue(x.id)).map(x=>x.id);
    if(!session.length){session=null;cur=0;flipped=false;renderFlash();renderStrip();syncPickers();return;}
    cur=0;flipped=false;renderFlash();renderStrip();syncPickers();return;
  }
  goTo(cur+1);
}));
$("#fPrev").onclick=()=>goTo(cur-1);
$("#fNext").onclick=()=>goTo(cur+1);
$("#fShuffle").onclick=()=>{
  const len=session?session.length:TERMS.length;
  goTo(Math.floor(Math.random()*len));
};

/* ---------- 挖空（与闪卡共享 cur） ---------- */
function renderCloze(){
  const t=curTerm();
  const idx=TERMS.findIndex(x=>x.id===t.id);
  $("#cNo").textContent="第 "+t.no+" 题 · "+(idx+1)+"/"+TERMS.length+(session?"（复盘模式）":"");
  $("#cTerm").textContent=t.term;
  let html=esc(t.def),n=0;
  const kws=[...t.kw].sort((a,b)=>b.length-a.length);
  kws.forEach(k=>{
    html=html.replace(esc(k),()=>`<input type="text" data-ans="${esc(k)}" style="width:${Math.max(70,k.length*16+22)}px" aria-label="填空 ${++n}" autocomplete="off">`);
  });
  $("#cDef").innerHTML=html;
  const sc=$("#cScore");sc.textContent="";sc.classList.remove("win");
}
$("#cCheck").onclick=()=>{
  const inputs=[...document.querySelectorAll("#cDef input")];
  let ok=0;
  inputs.forEach(inp=>{
    const ans=inp.dataset.ans.replace(/\s/g,""),val=inp.value.replace(/\s/g,"");
    inp.classList.remove("ok","bad");
    if(val&&ans===val){inp.classList.add("ok");ok++;}
    else{
      inp.classList.add("bad");
      if(!inp.nextElementSibling||!inp.nextElementSibling.classList.contains("ans")){
        const s=document.createElement("span");s.className="ans";s.textContent=inp.dataset.ans;
        inp.after(s);
      }
    }
  });
  const t=curTerm();
  const sc=$("#cScore");
  sc.textContent=ok===inputs.length?"全部答对 ✓ "+ok+"/"+inputs.length:"答对 "+ok+"/"+inputs.length;
  sc.classList.toggle("win",ok===inputs.length);
  setRec(t.id,ok===inputs.length?3:(ok>0?2:1));
  renderStrip();renderFlash();syncPickers();
};
$("#cPrev").onclick=()=>goTo(cur-1);
$("#cNext").onclick=()=>goTo(cur+1);

/* ---------- 复盘 ---------- */
function renderReview(){
  const due=TERMS.filter(t=>isDue(t.id));
  const body=$("#reviewBody");
  if(!due.length){
    body.innerHTML='<div class="review-empty"><b>复盘队列已清空！</b><br>没有模糊或遗忘的词，去闪卡或挖空里继续巩固吧。</div>';
    return;
  }
  body.innerHTML='<ul class="review-list">'+due.map(t=>{
    const r=rec(t.id);
    return '<li class="review-item lglass" data-id="'+t.id+'" role="button" tabindex="0"><span class="lvl l'+r.lvl+'">'+lvlName[r.lvl]+'</span><span class="t">'+esc(t.term)+'</span><span class="cnt">错过 '+r.fail+' 次 · 点击跳转</span></li>';
  }).join("")+'</ul><button class="btn-main" id="drillBtn">开始复盘（'+due.length+' 词）</button>';
  body.querySelectorAll(".review-item").forEach(li=>{
    const jump=()=>{
      const idx=TERMS.findIndex(t=>t.id===+li.dataset.id);
      session=null;switchTab("flash");goTo(idx);
    };
    li.addEventListener("click",jump);
    li.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();jump();}});
  });
  $("#drillBtn").onclick=()=>{
    session=due.map(t=>t.id);switchTab("flash");goTo(0);
  };
}
function renderPairs(){
  $("#pairTables").innerHTML=PAIRS.map(p=>
    '<table class="pair-table"><caption>'+p.name+'</caption>'+
    p.rows.map(r=>"<tr><th>"+r[0]+"</th><td>"+r[1]+"</td></tr>").join("")+"</table>"
  ).join("");
}

/* ---------- tabs ---------- */
function switchTab(name){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.tab===name));
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id==="panel-"+name));
  if(name==="review")renderReview();
  if(name==="cloze")renderCloze();
}
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>switchTab(t.dataset.tab)));

$("#resetBtn").onclick=()=>{
  if(confirm("确定清空所有记忆进度？此操作不可恢复。")){
    state={m:{}};save();
    session=null;cur=0;flipped=false;
    buildPickers();renderPairs();renderFlash();renderStrip();syncPickers();
    if(activePanel()==="review")renderReview();
  }
};

buildPickers();
renderPairs();
renderFlash();
renderStrip();
syncPickers();
</script>
</body>
</html>
